# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Configuration SonarCloud - Daily Quote API
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# IMPORTANT : Remplacez par VOTRE organization (généralement votre username GitHub en minuscules)
sonar.organization=linahamza

# IMPORTANT : Remplacez par VOTRE projectKey (format: username_repository-name)
sonar.projectKey=Linahamza_daily-quote-app

# Métadonnées du projet
sonar.projectName=Daily Quote API
sonar.projectVersion=1.0.4

# Chemins à analyser
sonar.sources=app,main.py
sonar.tests=tests

# Exclusions (ne pas analyser ces fichiers/dossiers)
sonar.exclusions=\
  **/venv/**,\
  **/__pycache__/**,\
  **/htmlcov/**,\
  **/.pytest_cache/**,\
  **/nginx/**,\
  **/*.pyc,\
  **/tests/**

# Configuration Python
sonar.language=py
sonar.sourceEncoding=UTF-8

# Rapports de couverture (optionnel - si vous avez pytest-cov)
# sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate : attend le résultat avant de continuer
sonar.qualitygate.wait=true