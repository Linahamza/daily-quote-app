# Configuration Nginx pour Daily Quote API

# Définir l'utilisateur (sécurité)
user nginx;

# Nombre de workers (auto = nombre de CPU)
worker_processes auto;

# Fichier de log des erreurs
error_log /var/log/nginx/error.log warn;

# Fichier PID du process Nginx
pid /var/run/nginx.pid;

# Configuration des événements
events {
    # Nombre max de connexions par worker
    worker_connections 1024;
}

# Configuration HTTP
http {
    # Types MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Format des logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Fichier de log des accès
    access_log /var/log/nginx/access.log main;

    # Optimisations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression gzip (économise bande passante)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Configuration du serveur
    server {
        # Port d'écoute
        listen 80;
        
        # Nom du serveur (optionnel en local)
        server_name localhost;

        # Charset
        charset utf-8;

        # Taille max du body (uploads)
        client_max_body_size 10M;

        # Location : toutes les requêtes
        location / {
            # Proxy vers Gunicorn
            proxy_pass http://127.0.0.1:8000;
            
            # Headers pour préserver les infos du client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;   #Si Gunicorn ne répond pas en 60s, Nginx retourne une erreur
        }

        # Health check rapide (pas de proxy)
        location /health {
            proxy_pass http://127.0.0.1:8000/api/health;
            access_log off;  # Pas de log pour health checks
        }

        # Gestion des erreurs
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}