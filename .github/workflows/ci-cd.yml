# .github/workflows/ci-cd.yml
# Pipeline CI/CD pour Daily Quote API

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: daily-quote

jobs:
  # Job 1 : Scan de sécurité (secrets)
  security-scan:
    name: Security Scan - Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
       # Step 1 : Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2 : Installation de Gitleaks
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

  
      # Step 3 : Scanner et ignorer README.md
      - name: Run Gitleaks
        run: |
          # Scanner et créer un rapport JSON
          gitleaks detect --source . --no-git --redact --report-format json --report-path results.json --exit-code 0
          
          # Si aucun secret trouvé, SUCCESS
          if [ ! -f results.json ] || [ ! -s results.json ]; then
            echo "✅ No secrets found"
            exit 0
          fi
          
          # Filtrer pour exclure README.md
          secrets_count=$(jq '[.[] | select(.File != "README.md")] | length' results.json)
          
          if [ "$secrets_count" -eq 0 ]; then
            echo "✅ No secrets found in code (README.md ignored)"
            exit 0
          else
            echo "❌ Found $secrets_count secret(s) in code:"
            jq -r '[.[] | select(.File != "README.md")] | .[] | "  - \(.File):\(.StartLine) [\(.RuleID)]"' results.json
            exit 1
          fi



  # Job 2 : Build et Push (APRÈS security-scan)
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan  # ← Attend que security-scan réussisse

    steps:
      # Step 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 : Set up Docker Buildx (build avancé)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 : Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4 : Extraire les métadonnées (tags, labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Step 5 : Build et Push l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6 : Afficher les tags créés
      - name: Image tags
        run: echo "Tags created:- ${{ steps.meta.outputs.tags }}"
  
  # Job 3 : Scan de vulnérabilités de l'image
  vulnerability-scan:  
    name: Vulnerability Scan - Docker Image
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0