# .github/workflows/ci-cd.yml
# Pipeline CI/CD pour Daily Quote API

name: CI/CD Pipeline

# Déclencheurs : À chaque push sur la branche main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Variables d'environnement globales
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: daily-quote

jobs:
  # Job 1 : Build et Push Docker
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      # Step 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2 : Set up Docker Buildx (build avancé)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3 : Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Step 4 : Extraire les métadonnées (tags, labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      
      # Step 5 : Build et Push l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Step 6 : Afficher les tags créés
      - name: Image tags
        run: echo "Tags created:- ${{ steps.meta.outputs.tags }}"